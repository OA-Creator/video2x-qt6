name: Android-App bauen

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  NCNN_VERSION: "20261020"

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: ncnn für Android holen
        run: |
          mkdir -p android/ncnn
          cd android/ncnn
          curl -sSL -o ncnn.zip https://github.com/Tencent/ncnn/releases/download/${NCNN_VERSION}/ncnn-${NCNN_VERSION}-android-vulkan.zip
          unzip -q ncnn.zip
          rm ncnn.zip
          ls

      - name: Netz prüfen
        run: |
          curl -sSI https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.20/kotlin-stdlib-jdk8-1.9.20.pom | head -5 || true
          curl -sSI https://maven-central.storage-download.googleapis.com/maven2/org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.20/kotlin-stdlib-jdk8-1.9.20.pom | head -5 || true

      - name: APK bauen
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --stacktrace --refresh-dependencies
          cp app/build/outputs/apk/release/app-release.apk ../OliVision.apk

      - name: APK aufheben
        uses: actions/upload-artifact@v4
        with:
          name: OliVision-apk
          path: OliVision.apk

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${{ github.run_number }}"
          gh release create "$tag" OliVision.apk \
            --title "OliVision für Android (Build ${{ github.run_number }})" \
            --notes "OliVision fürs Handy: Videos und Fotos verbessern und vergrößern (Gleich, Full HD, QHD, 4K), läuft auch bei gesperrtem Handy weiter."
