plugins {
    id 'com.android.application'
}

def ncnnRoot = System.getenv('NCNN_ROOT') ?: "${rootDir}/ncnn/ncnn-20261020-android-vulkan"
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'de.oli.olivision'
    compileSdk 35
    ndkVersion System.getenv('NDK_VERSION') ?: '29.0.14206865'

    defaultConfig {
        applicationId 'de.oli.olivision'
        minSdk 29
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DNCNN_ROOT=${ncnnRoot}", '-DANDROID_STL=c++_static'
                cppFlags '-O3 -fexceptions -frtti'
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/olivision.jks")
            storePassword 'olivision'
            keyAlias 'olivision'
            keyPassword 'olivision'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['bin', 'param']
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
